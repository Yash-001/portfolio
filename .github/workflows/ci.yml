name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Export knowledge JSON
        run: npx vite-node scripts/export-knowledge.ts

      - name: Typecheck
        run: vue-tsc --noEmit

      - name: Lint
        run: eslint . --ext .vue,.ts,.tsx --max-warnings 0

      - name: Build
        run: vite build
